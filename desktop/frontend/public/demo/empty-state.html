<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mady — 新对话</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --mady-bg-primary: #ffffff;
    --mady-bg-secondary: #f2f2f7;
    --mady-bg-tertiary: #ffffff;
    --mady-text-primary: #000000;
    --mady-text-secondary: rgba(0,0,0,0.55);
    --mady-text-tertiary: rgba(0,0,0,0.25);
    --mady-text-link: #007aff;
    --mady-accent: #5856d6;
    --mady-accent-hover: #4b4ac4;
    --mady-accent-soft: rgba(88,86,214,0.08);
    --mady-accent-glow: rgba(88,86,214,0.18);
    --mady-danger: #ff3b30;
    --mady-success: #34c759;
    --mady-warning: #ff9500;
    --mady-info: #007aff;
    --mady-separator: rgba(0,0,0,0.10);
    --mady-border: rgba(0,0,0,0.10);
    --font-sans: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
  }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: var(--font-sans);
    background: var(--mady-bg-primary);
    color: var(--mady-text-primary);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* macOS 风格滚动条 */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--mady-separator); border-radius: var(--radius-sm); }

  /* 布局 */
  .app { display: flex; flex-direction: column; height: 100%; }
  .body { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: 240px; background: var(--mady-bg-secondary);
    border-right: 1px solid var(--mady-separator);
    display: flex; flex-direction: column; user-select: none;
  }
  .sidebar-top { padding: 12px; border-bottom: 1px solid var(--mady-separator); }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px; }
  .sidebar-bottom { padding: 8px; border-top: 1px solid var(--mady-separator); }

  .btn-new {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 8px 12px;
    border: none; border-radius: var(--radius-md);
    background: var(--mady-accent); color: white;
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-new:hover { background: var(--mady-accent-hover); }

  .search-box {
    position: relative; margin-top: 8px;
  }
  .search-box input {
    width: 100%; padding: 6px 10px 6px 28px;
    border: 1px solid var(--mady-border); border-radius: var(--radius-md);
    background: var(--mady-bg-primary);
    color: var(--mady-text-primary);
    font-size: 12px; outline: none;
  }
  .search-box input:focus { border-color: var(--mady-accent); }
  .search-box input::placeholder { color: var(--mady-text-tertiary); }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--mady-text-tertiary); }

  .sidebar-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 8px 12px;
    border: none; border-radius: var(--radius-md);
    background: transparent; color: var(--mady-text-primary);
    font-size: 12px; cursor: pointer; transition: background 0.1s;
    text-align: left;
  }
  .sidebar-item:hover { background: var(--mady-bg-secondary); }
  .sidebar-item.active { background: var(--mady-accent-soft); color: var(--mady-accent); }
  .sidebar-item .icon { opacity: 0.5; flex-shrink: 0; }
  .sidebar-item .count { color: var(--mady-text-tertiary); font-size: 11px; margin-left: auto; }

  .btn-settings {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 8px 12px;
    border: none; border-radius: var(--radius-md);
    background: transparent; color: var(--mady-text-secondary);
    font-size: 12px; cursor: pointer; transition: background 0.1s;
  }
  .btn-settings:hover { background: var(--mady-bg-primary); }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* Header */
  .header {
    height: 40px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; border-bottom: 1px solid var(--mady-separator);
    background: rgba(242,242,247,0.5); backdrop-filter: blur(8px);
    -webkit-app-region: drag;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-left h1 { font-size: 13px; font-weight: 500; }
  .header-right { display: flex; align-items: center; gap: 4px; }

  .btn-icon {
    padding: 6px; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--mady-text-secondary);
    cursor: pointer; font-size: 13px; transition: background 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-icon:hover { background: var(--mady-bg-secondary); }
  .btn-icon.active { background: var(--mady-accent-soft); color: var(--mady-accent); }

  /* Content */
  .content { flex: 1; display: flex; align-items: center; justify-content: center; overflow-y: auto; }
  .empty-state { text-align: center; max-width: 400px; padding: 0 24px; }

  .empty-icon {
    width: 48px; height: 48px; border-radius: 16px;
    background: var(--mady-accent-soft);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .empty-icon svg { width: 24px; height: 24px; color: var(--mady-accent); }

  .empty-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .empty-desc { font-size: 14px; color: var(--mady-text-secondary); margin-bottom: 24px; line-height: 1.5; }

  .quick-starts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .quick-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 16px 12px;
    border: 1px solid var(--mady-border); border-radius: var(--radius-lg);
    background: var(--mady-bg-secondary);
    cursor: pointer; transition: all 0.15s;
    font-family: var(--font-sans);
  }
  .quick-btn:hover { border-color: var(--mady-accent); background: var(--mady-accent-soft); }
  .quick-btn .q-icon { font-size: 20px; }
  .quick-btn .q-label { font-size: 13px; font-weight: 500; color: var(--mady-text-primary); }
  .quick-btn .q-desc { font-size: 11px; color: var(--mady-text-tertiary); }

  /* StatusBar */
  .statusbar {
    height: 28px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
    background: var(--mady-bg-secondary);
    border-top: 1px solid var(--mady-separator);
    font-size: 11px; color: var(--mady-text-secondary);
    user-select: none;
  }
  .statusbar-left, .statusbar-right { display: flex; align-items: center; gap: 12px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mady-text-tertiary); }
  .status-dot.ready { background: var(--mady-text-tertiary); }
  .sep { color: var(--mady-separator); }
</style>
</head>
<body>
<div class="app">
  <div class="body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="btn-new">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新对话
        </button>
        <div class="search-box">
          <span class="search-icon">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="text" placeholder="搜索会话…">
        </div>
      </div>
      <nav class="sidebar-nav">
        <p style="color:var(--mady-text-tertiary);font-size:11px;text-align:center;padding-top:60px;">暂无会话</p>
      </nav>
      <div class="sidebar-bottom">
        <button class="btn-settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          设置
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="header">
        <div class="header-left">
          <h1>Mady</h1>
        </div>
        <div class="header-right">
          <button class="btn-icon" title="文档预览">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
        </div>
      </header>

      <div class="content">
        <div class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
          <h2 class="empty-title">开始新对话</h2>
          <p class="empty-desc">与 Mady 助手交流，获取专利分析与法律问题解答</p>

          <div class="quick-starts">
            <button class="quick-btn">
              <span class="q-icon">📝</span>
              <span class="q-label">AI 辅助撰写</span>
              <span class="q-desc">撰写权利要求书</span>
            </button>
            <button class="quick-btn">
              <span class="q-icon">📋</span>
              <span class="q-label">OA 答复辅助</span>
              <span class="q-desc">答复审查意见</span>
            </button>
            <button class="quick-btn">
              <span class="q-icon">🔍</span>
              <span class="q-label">专利检索</span>
              <span class="q-desc">检索现有技术</span>
            </button>
            <button class="quick-btn">
              <span class="q-icon">💬</span>
              <span class="q-label">自由对话</span>
              <span class="q-desc">直接开始提问</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- StatusBar -->
  <footer class="statusbar">
    <div class="statusbar-left">
      <span style="display:flex;align-items:center;gap:6px;">
        <span class="status-dot ready"></span>
        就绪
      </span>
    </div>
    <div class="statusbar-right">
      <span style="display:flex;align-items:center;gap:4px;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 18h.01"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/></svg>
        v0.1.0
      </span>
    </div>
  </footer>
</div>
</body>
</html>
