    output_contracts:
      - path: outputs/reasoning-enablement.md
        contract_level: hard
    forbidden_actions:
      - 不得编造实施例
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

  - id: R-05
    worker: reasoning-claim-unsupported
    tier: reasoning
