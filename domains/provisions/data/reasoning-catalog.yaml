    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

  - id: R-07
    worker: reasoning-equivalent-infringement
    tier: reasoning
    name: 等同侵权推理
    outputs:
      - outputs/reasoning-equivalent-infringement.md
    required_inputs:
      - outputs/infringement-literal-analysis.md
    allowed_tools: [read, write, knowledge_search, knowledge_rules]
    input_contracts:
      - path: outputs/infringement-literal-analysis.md
        quality_gate: infringement-literal-analysis.md
    output_contracts:
      - path: outputs/reasoning-equivalent-infringement.md
        contract_level: hard
    forbidden_actions:
      - 不得扩大等同至申请日时尚未公开的技术
      - 不得忽略禁止反悔原则
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

