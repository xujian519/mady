# 专利 Reasoning 推理智能体目录（reasoning-*）
# 从 workers-catalog.yaml 体系独立（2026-06-26）
# 由 rule-explorer 输出 reasoningPatterns[] 后按需激活
# 代码层由 worker-catalog.ts 的 loadWorkersCatalog() 合并加载。
#
# 契约模式：统一依赖 CAP02 报告（technical-analysis-report.md），contract_level: hard

reasoning:
  # ==================== 预注册（rule-explorer 常见输出）====================

  - id: R-01
    worker: reasoning-prior-art-identification
    tier: reasoning
    name: 现有技术识别
    outputs:
      - outputs/reasoning-prior-art-identification.md
    required_inputs:
      - outputs/search-results.md
    allowed_tools: [read, write, knowledge_search, knowledge_rules]
    input_contracts:
      - path: outputs/search-results.md
        quality_gate: search-results.md
    output_contracts:
      - path: outputs/reasoning-prior-art-identification.md
        contract_level: hard
    forbidden_actions:
      - 不得编造对比文件
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

  - id: R-02
    worker: reasoning-disclosure-type
    tier: reasoning
    name: 公开类型判断
    outputs:
      - outputs/reasoning-disclosure-type.md
    required_inputs:
      - outputs/search-results.md
    allowed_tools: [read, write, knowledge_search, knowledge_rules]
    input_contracts:
      - path: outputs/search-results.md
        quality_gate: search-results.md
    output_contracts:
      - path: outputs/reasoning-disclosure-type.md
        contract_level: hard
    forbidden_actions:
      - 不得编造公开方式认定
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

  - id: R-03
    worker: reasoning-obviousness-effect
    tier: reasoning
    name: 显而易见性技术效果分析
    outputs:
      - outputs/reasoning-obviousness-effect.md
    required_inputs:
      - outputs/technical-analysis-report.md
    allowed_tools: [read, write, knowledge_search, knowledge_rules, knowledge_graph_path]
    input_contracts:
      - path: outputs/technical-analysis-report.md
        quality_gate: technical-analysis-report.md
    output_contracts:
      - path: outputs/reasoning-obviousness-effect.md
        contract_level: hard
    forbidden_actions:
      - 不得事后诸葛亮
      - 不得编造技术效果
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

  - id: R-04
    worker: reasoning-enablement
    tier: reasoning
    name: 充分公开判断
    outputs:
      - outputs/reasoning-enablement.md
    required_inputs:
      - outputs/technical-analysis-report.md
