# 专利 Provision 条款分析智能体目录（P-*）
# 从 workers-catalog.yaml 拆分而来（2026-06-26）
# 与 workers-catalog.yaml (W-*) 和 checkers-catalog.yaml (K-*) 配合使用
# 代码层由 worker-catalog.ts 的 loadWorkersCatalog() 合并加载三文件。
#
# 契约字段说明（与 workers-catalog.yaml 一致，详见该文件头部注释）。

provisions:
  - id: P-A01
    worker: provision-novelty
    tier: provision
    name: 新颖性条款分析
    outputs:
      - outputs/novelty-analysis.md
    required_inputs:
      - outputs/technical-analysis-report.md
    allowed_tools: [read, write, knowledge_search, knowledge_rules]
    input_contracts:
      - path: outputs/technical-analysis-report.md
        quality_gate: technical-analysis-report.md
    output_contracts:
      - path: outputs/novelty-analysis.md
        standard_key: novelty-analysis.md
        contract_level: hard
    forbidden_actions:
      - 不得组合多篇对比文件评价新颖性（这是创造性评价方式）
      - 不得使用"结合公知常识"判断新颖性缺失
      - 不得编造对比文件
      - 无 technical-analysis-report.md 不得出最终法律结论
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

  - id: P-A02
    worker: provision-inventiveness
    tier: provision
    name: 创造性条款分析
    outputs:
      - outputs/inventiveness-analysis.md
    required_inputs:
      - outputs/technical-analysis-report.md
    allowed_tools: [read, write, knowledge_search, knowledge_rules, knowledge_graph_path]
    input_contracts:
      - path: outputs/technical-analysis-report.md
        quality_gate: technical-analysis-report.md
      - path: outputs/search-results.md
        quality_gate: search-results.md
        optional: true
    output_contracts:
      - path: outputs/inventiveness-analysis.md
        standard_key: inventiveness-analysis.md
        contract_level: hard
    forbidden_actions:
      - 不得事后诸葛亮（用发明后的认知评价创造性）
      - 不得将区别特征数量作为创造性标准
      - 不得编造技术启示
      - 无 technical-analysis-report.md 不得出最终法律结论
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

  - id: P-A05
    worker: provision-disclosure
    tier: provision
    name: 充分公开分析
    outputs:
      - outputs/disclosure-analysis.md
    required_inputs:
      - outputs/technical-analysis-report.md
      - data/cases/{caseId}/converted/
    allowed_tools: [read, write, knowledge_search, knowledge_rules]
    input_contracts:
      - path: outputs/technical-analysis-report.md
        quality_gate: technical-analysis-report.md
      - path: data/cases/{caseId}/converted/
        content_schema: [说明书全文, 实施例]
    output_contracts:
      - path: outputs/disclosure-analysis.md
        standard_key: disclosure-analysis.md
        contract_level: hard
    forbidden_actions:
      - 不得编造实施例
      - 不得强行下公开不充分结论
      - 无 technical-analysis-report.md 不得出最终法律结论
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

  - id: P-A06
    worker: provision-claims-clarity
    tier: provision
    name: 清楚与支持分析
    outputs:
      - outputs/claims-support-analysis.md
    required_inputs:
      - outputs/technical-analysis-report.md
    allowed_tools: [read, write, knowledge_search, knowledge_rules]
    input_contracts:
      - path: outputs/technical-analysis-report.md
        quality_gate: technical-analysis-report.md
    output_contracts:
      - path: outputs/claims-support-analysis.md
        standard_key: claims-support-analysis.md
        contract_level: hard
    forbidden_actions:
      - 不得编造法条引用
      - 无 technical-analysis-report.md 不得出最终法律结论
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

  - id: P-B02
    worker: provision-infringement-literal
    tier: provision
    name: 字面侵权分析
    outputs:
      - outputs/infringement-literal-analysis.md
    required_inputs:
      - outputs/technical-analysis-report.md
    allowed_tools: [read, write, knowledge_search, knowledge_rules]
    input_contracts:
      - path: outputs/technical-analysis-report.md
        quality_gate: technical-analysis-report.md
        description: 涉案专利与被控方案双端 CAP02 解构
    output_contracts:
      - path: outputs/infringement-literal-analysis.md
        standard_key: infringement-literal-analysis.md
        contract_level: hard
    forbidden_actions:
      - 无涉案专利与被控方案双端解构不得出侵权判定
      - 不得忽略禁止反悔原则对等同适用的限制
      - 不得扩大等同至申请日时尚未公开的技术
    can_invoke: [provision-infringement-equivalent]
    on_block: output_blockage_list
    triggers_hitl: false

  - id: P-C04
    worker: provision-prior-art
    tier: provision
    name: 现有技术认定
    outputs:
      - outputs/prior-art-analysis.md
    required_inputs:
      - outputs/search-results.md
    allowed_tools: [read, write, knowledge_search]
    input_contracts:
      - path: outputs/search-results.md
        quality_gate: search-results.md
    output_contracts:
      - path: outputs/prior-art-analysis.md
        standard_key: prior-art-analysis.md
        contract_level: hard
    forbidden_actions:
      - 不得编造公开日期
      - 不得编造文献
    can_invoke: []
    on_block: output_blockage_list
    triggers_hitl: false

