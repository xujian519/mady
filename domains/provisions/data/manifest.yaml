    concept_ids: [外观设计]
    methodology_steps:
      - 确定外观设计产品的用途和外观设计保护范围
      - 从一般消费者的角度进行整体观察、综合判断
      - 分析设计空间，判断是否存在较大的设计自由度
      - 将本外观设计与现有设计进行对比，判断是否具有明显区别
      - 给出外观设计专利授权前景评估结论
