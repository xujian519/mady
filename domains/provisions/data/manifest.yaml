    legal_basis:
      - 专利法第62条（现有技术抗辩）
      - 专利法第75条（不视为侵权的情形）
      - 专利法第77条（药品专利早期解决机制）
      - 专利法第80条（Bolar 例外补充规定）
    wiki_roots:
      - 专利实务/侵权抗辩
      - 诉讼/侵权
    concept_ids: [现有技术抗辩, 先用权, 合法来源, 药品行政审批, 不视为侵权]
