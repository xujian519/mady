# 专利条款智能体 manifest — Tier A 条款簇
# pre_register: true 的条目在 runtime 预注册为 workflow worker + subagent

provisions:
  - id: P-A01
    worker: provision-novelty
    name: 新颖性条款智能体
    pre_register: true
    legal_basis:
      - 专利法第22条第2款
    wiki_roots:
      - 专利实务/新颖性
      - 复审无效/新颖性
    concept_ids: [新颖性, 单独对比, 抵触申请, 现有技术]
    methodology_steps:
      - 读取 CAP02 产出：technical-analysis-report.md、distinctive-features.md、technical-comparison-matrix.md
      - 解析权利要求技术特征（与 CAP02 特征清单交叉验证）
      - 检索对比文件
      - 单独对比分析
      - 判断新颖性结论
    primary_tools: [read, grep, glob, knowledge_search, knowledge_rules]

  - id: P-A02
    worker: provision-inventiveness
    name: 创造性条款智能体
    pre_register: true
    legal_basis:
      - 专利法第22条第3款
      - 专利审查指南第二部分第四章
      - 专利审查指南第二部分第三章 2.6
      - 专利审查指南第二部分第四章 3.2.1
      - 专利审查指南第二部分第四章 5（辅助因素）
    wiki_roots:
      - 专利实务/创造性
      - 复审无效/创造性
    concept_ids: [创造性, 三步法, 区别特征, 技术启示, 发明类型, 预料不到的技术效果, 商业成功]
    methodology_steps:
      - 读取 CAP02 产出：distinctive-features.md、tech-graph-report.md、technical-comparison-matrix.md、claim-deconstruction-*.yaml（如有）
      - Step 1 — 确定最接近的现有技术：技术领域相同、技术问题最接近、公开特征最多的对比文件
      - Step 2 — 确定区别技术特征：将权利要求与最接近现有技术逐特征对比，须与 CAP02 区别特征清单一致；每个区别特征标注其所属的发明类型（见下）
      - Step 3 — 确定实际解决的技术问题：基于区别特征在权利要求中的客观技术作用，避免使用发明的说明书描述的"发明目的"作为答案
      - Step 4 — 判断显而易见性：分析区别特征是否被其他对比文件公开（含是否属于公知常识/惯用手段），判断本领域技术人员是否有动机将其结合到最接近的现有技术
      - 6 种发明类型区分：（1）开拓性发明——区别特征构成全新的技术方案，创造性独立于现有技术；（2）组合发明——区别特征涉及多个已知技术的组合，需判断组合是否产生预料不到的技术效果；（3）选择发明——区别特征是从已知范围中选择特定方案，需判断选择是否带来预料不到的效果；（4）转用发明——区别特征是将已知技术应用于新领域，需判断是否存在技术启示；（5）已知产品新用途——区别特征是已知产品的用途变化，需判断用途是否可预料；（6）要素变更发明——区别特征是已知产品的要素（位置/关系/数值）变化，需判断变化是否具有技术意义
      - 辅助判断因素评估：（a）预料不到的技术效果——区别特征是否带来本领域技术人员无法预见的质变或量变，引用实验数据/对比例；（b）解决了长期渴望解决的技术难题——该技术问题是否存在长期而未解决的记录；（c）商业成功——产品在市场上是否由于技术特征而非营销/广告因素获得成功；（d）他人克服技术偏见——在先文献是否教导避开该方向，发明却反其道而行之；（e）现有技术中是否存在相反教导——对比文件是否教导远离本发明的方向
      - 输出结论：具备创造性 / 不具备创造性，附三步法推导链
    primary_tools: [read, grep, glob, knowledge_search, knowledge_rules, knowledge_graph_path]

