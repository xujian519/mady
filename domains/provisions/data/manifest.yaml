  - id: P-D01
    worker: provision-drafting-claims
    name: 权利要求书撰写智能体
    pre_register: true
    legal_basis:
      - 专利法第26条第4款
      - 专利法实施细则第20条至第23条
      - 专利审查指南第二部分第二章
    wiki_roots:
      - 专利实务/撰写
      - 专利实务/权利要求
    concept_ids: [权利要求, 必要技术特征, 独立权利要求, 从属权利要求, 多层次防御]
    methodology_steps:
      - "从技术交底书/技术方案中提取发明点和全部必要技术特征（区分必要特征与非必要特征）"
      - "（1）第一层——独立权利要求：覆盖最核心的必要技术特征，保护范围最宽；（2）第二层——直接引用独立权利要求的从属权利要求：增加优选/进一步限定特征；（3）第三层——多级从属：逐层缩小保护范围的备选方案；（4）第四层——外围特征"
      - 独立权利要求撰写：前序部分 + 特征部分（其特征在于……），确保包括全部必要技术特征且不含非必要特征
      - 从属权利要求撰写：引用基础 + 限定部分（如"如权利要求1所述的……，其特征在于……"），覆盖：优选实施例、替代方案、数值范围、材料/方法/结构的具体选择
      - 权利要求书逻辑检查：逐条一致性检查（是否存在矛盾）、支持性检查（每项权利要求是否得到说明书支持）、范围梯度检查（从宽到窄是否合理过渡）
      - 输出：完整权利要求书（含逐项编号和引用关系）
    primary_tools: [read, grep, write, knowledge_search, knowledge_rules]

  - id: P-A08
    worker: provision-unity
    name: 单一性条款智能体
    pre_register: false
    legal_basis:
      - 专利法第31条
    wiki_roots:
      - 专利实务/单一性
    concept_ids: [单一性]
    methodology_steps:
      - 识别所有权利要求之间的相同或相应的特定技术特征
      - 将权利要求分组，判断是否存在技术关联
      - 分析各权利要求组之间是否属于一个总的发明构思
      - 若存在无单一性的分组，明确指出并说明理由
      - 给出单一性结论，引用专利法第31条及其实施细则第34条
    primary_tools: [read, knowledge_search, knowledge_rules]

  - id: P-A09
