    serves: [P-A06]
    primary_tools: [knowledge_search, knowledge_rules]

  - id: R-06
    worker: reasoning-subject-matter
    name: 保护客体认定推理
    pre_register: true
    wiki_page: 推理模式/推理模式-保护客体-技术方案认定
    serves: [P-A04]
    primary_tools: [knowledge_search, knowledge_rules]

  - id: R-07
    worker: reasoning-equivalent-infringement
    name: 等同侵权认定推理
    pre_register: true
    wiki_page: 推理模式/推理模式-侵权-等同侵权认定
    serves: [P-B03]
    primary_tools: [knowledge_search, knowledge_rules, knowledge_graph_path]

  - id: R-08
    worker: reasoning-conflicting-application
    name: 抵触申请与优先权推理
    pre_register: false
    wiki_page: 推理模式/推理模式-新颖性-抵触申请与优先权
    serves: [P-A01, P-C05]
    methodology_steps:
      - 确定在先申请的申请日和公开日
      - 判断在先申请是否构成抵触申请（申请日在先、公开日在后）
      - 分析两份申请是否涉及相同主题
      - 评估优先权是否影响抵触申请的判断
      - 给出抵触申请认定的推理结论
    primary_tools: [knowledge_search, knowledge_rules]

  - id: R-09
    worker: reasoning-routine-selection
    name: 惯用手段与常规选择推理
    pre_register: false
    wiki_page: 推理模式/推理模式-创造性-惯用手段与常规选择
    serves: [P-A02]
    methodology_steps:
      - 确定区别技术特征的技术领域
      - 分析该区别特征是否属于该领域的公知常识
      - 判断是否属于本领域技术人员的惯用手段或常规选择
      - 搜索教科书、技术手册等公知常识证据
      - 给出惯用手段认定结论
    primary_tools: [knowledge_search, knowledge_rules]

  - id: R-10
    worker: reasoning-claim-unclear
    name: 权利要求不清楚认定推理
    pre_register: false
    wiki_page: 推理模式/推理模式-权利要求-不清楚认定
    serves: [P-A06]
    methodology_steps:
      - 逐字分析权利要求中的关键技术用语
      - 判断用语是否具有明确且唯一的技术含义
      - 检查是否存在导致保护范围不确定的模糊表述
      - 分析功能性限定是否通过说明书得到支持
      - 给出权利要求清楚性认定结论
    primary_tools: [knowledge_search, knowledge_rules]

  - id: R-11
    worker: reasoning-functional-limitation
    name: 功能性限定认定推理
    pre_register: false
    wiki_page: 推理模式/推理模式-权利要求-功能性限定
    serves: [P-A06]
    methodology_steps:
      - 识别权利要求中的功能性限定特征
      - 确定功能性限定在说明书中对应的具体实施方式
      - 判断功能性限定是否覆盖了所有实现该功能的方式
      - 分析功能性限定对保护范围的影响
      - 给出功能性限定认定结论
    primary_tools: [knowledge_search, knowledge_rules]

  - id: R-12
    worker: reasoning-experimental-data
    name: 实验数据要求推理
    pre_register: false
    wiki_page: 推理模式/推理模式-说明书-实验数据要求
    serves: [P-A05]
    methodology_steps:
      - 确定发明所属的技术领域（医药/化学/生物等需要实验数据的领域）
      - 分析说明书是否提供了充分的实验数据
      - 判断实验数据是否能证明发明的技术效果
      - 评估是否需要补充实验数据
      - 给出实验数据充分性认定结论
    primary_tools: [knowledge_search, knowledge_rules]

  - id: R-13
    worker: reasoning-amendment-priority
    name: 修改超范围与优先权推理
    pre_register: false
    wiki_page: 推理模式/推理模式-程序-修改超范围与优先权
    serves: [P-A07, P-C05]
    methodology_steps:
      - 确定修改的内容和修改依据
      - 判断修改内容是否能从原申请文件中直接、毫无疑义地确定
      - 分析修改是否超出原权利要求书和说明书记载的范围
      - 若涉及优先权，判断修改是否超出优先权文件的范围
      - 给出修改超范围认定结论
    primary_tools: [knowledge_search, knowledge_rules]

  - id: R-14
    worker: reasoning-design-space
    name: 外观设计设计空间推理
    pre_register: false
    wiki_page: 推理模式/推理模式-外观设计-设计空间
    serves: [P-A09]
    methodology_steps:
      - 确定外观设计产品的种类和用途
      - 分析该产品领域的设计空间大小
      - 评估现有设计的多样性和设计自由度
      - 判断设计空间对创造性判断的影响
      - 给出设计空间分析结论
    primary_tools: [knowledge_search, knowledge_rules]
