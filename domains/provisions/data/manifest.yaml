    concept_ids: [说明书, 实施例, 背景技术, 充分公开, 五部分]
    methodology_steps:
      - 分析发明点与技术问题，确定说明书的整体框架
      - >
        说明书五部分结构撰写（参照 specification-writing-v1.md 详细指南）：
        (1) 发明名称 (2) 技术领域 (3) 背景技术 (4) 发明内容 (5) 具体实施方式
      - 撰写具体实施方式，提供足够数量的实施例（覆盖独立权利要求全部特征 + 从属权利要求的优选方案）
      - 检查说明书与权利要求的对应关系（确保独权的全部特征在说明书中都有记载）
      - 检查充分公开：本领域技术人员能否根据说明书实现发明
    primary_tools: [read, grep, write, knowledge_search, knowledge_rules]

  - id: P-D03
    worker: patent-oa-response-drafter
    name: 审查意见答复条款智能体
    pre_register: false
    legal_basis:
      - 专利法第26条
      - 专利审查指南
    wiki_roots:
      - 专利实务/撰写
      - 审查指南
    concept_ids: [审查意见答复, 意见陈述书, 修改]
    methodology_steps:
      - 读取CAP02产出和审查意见全文
      - 逐条分析审查意见的每一条驳回理由
      - 针对每条理由制定答复策略（修改权利要求/陈述意见/提交证据）
      - 撰写意见陈述书
      - 检查答复书的格式规范性和逻辑完整性
    primary_tools: [read, grep, write, knowledge_search, knowledge_rules]

reasoning:
