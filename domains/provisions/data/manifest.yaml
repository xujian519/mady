      - 分析现有技术抗辩是否成立（被控技术是否属于现有技术）
      - 分析先用权抗辩是否成立（是否在申请日前已制造或准备）
      - 分析合法来源抗辩是否成立（是否通过合法商业途径获得）
      - 分析权利用尽抗辩等其他抗辩事由
      - 给出抗辩成立与否的综合结论
