id: patent-drafting
name: 专利撰写
case_type: patent_drafting
steps:
  - id: s1-retrieve
    step_type: retrieve
    entry_point: prior-art-search
  - id: s2-disclosure
    step_type: analyze
    entry_point: disclosure
  - id: s3-draft
    step_type: draft
    entry_point: report-draft
  - id: s4-check
    step_type: check
    entry_point: checker-review
    # 条件回退（DSH manifest retry 语义）：检查不过时回到起草步骤重做。
    retry:
      when_output_matches: "需修订|不合格|缺少|不一致"
      rewind_to: s3-draft
      max_retries: 1
