# Mady 专利条款智能体 Manifest
#
# 定义三层智能体模型：Tier A 条款簇 → Tier B 推理模式 → Tier C 领域专家。
# 本文件受 AI_CHANGELOG.md 记录约束，修改后须同步更新。
#
# pre_register: true 的条目在启动时由 Provisions 包自动注册为 Handoff 子 Agent。

# =============================================================================
# Tier A — 专利核心条款簇（最小完备集 22 条，首批高频 9 条）
# =============================================================================
# I. 授权与确权（实审/无效核心）
provisions:

  # P-A01 — 新颖性（专利法第 22 条第 2 款）
  - id: "P-A01"
    worker: "provision-novelty"
    name: "新颖性条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第22条第2款"
    concept_ids: ["新颖性", "单独对比", "抵触申请", "现有技术"]
    methodology_steps:
      - "确定申请日/优先权日，识别对比文件公开日"
      - "逐特征提取权利要求技术特征"
      - "单独对比：一份对比文件逐特征比对，禁止多份文件组合"
      - "上下位概念判断与惯用手段直接置换"
      - "抵触申请三要件检验（时间/公开/内容）"
      - "宽限期审查（A24）与优先权例外（A29）"
      - "结论：具备新颖性 / 不具备新颖性，附对比推导"
    primary_tools: ["read", "grep", "knowledge_search", "search_knowledge", "knowledge_rules"]
    existing_subgraph: "domains/novelty"  # Mady 已有 Pregel 子图
    tool_hints: "使用 evaluate_novelty 工具进行逐特征对比分析（参数：claims/PriorArtDocs/ConflictApps）"

  # P-A02 — 创造性（专利法第 22 条第 3 款）
  - id: "P-A02"
    worker: "provision-inventiveness"
    name: "创造性条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第22条第3款"
      - "专利审查指南第二部分第四章"
    concept_ids: ["创造性", "三步法", "区别特征", "技术启示", "预料不到的技术效果"]
    methodology_steps:
      - "Step 1 — 确定最接近的现有技术"
      - "Step 2 — 确定区别技术特征和实际解决的技术问题"
      - "Step 3 — 判断是否存在技术启示"
      - "Step 4 — 辅助判断因素评估（预料不到的效果/商业成功/长期需求）"
      - "结论：具备创造性 / 不具备创造性，附三步法推导链"
    primary_tools: ["read", "grep", "knowledge_search", "search_knowledge", "knowledge_rules", "knowledge_graph_path"]
    existing_subgraph: "domains/inventiveness"  # Mady 已有 Pregel 子图
    tool_hints: "使用 evaluate_inventiveness 工具进行三步法分析（参数：prior_art_chunks/features_analysis）"

  # P-A03 — 实用性（专利法第 22 条第 4 款）
  - id: "P-A03"
    worker: "provision-utility"
    name: "实用性条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第22条第4款"
    concept_ids: ["实用性", "能够制造", "能够使用", "积极效果"]
    methodology_steps:
      - "分析技术方案能否在产业上制造或使用"
      - "判断是否具备实用性（非仅仅是一种设想）"
      - "评估是否具有积极效果"
      - "结论：具备实用性 / 不具备实用性"
    primary_tools: ["read", "grep", "knowledge_search", "search_knowledge"]

  # P-A04 — 保护客体（专利法第 25 条、第 5 条）
  - id: "P-A04"
    worker: "provision-eligibility"
    name: "保护客体条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第25条（不授予专利权的情形）"
      - "专利法第5条（违反法律/社会公德/妨害公共利益）"
    concept_ids: ["不授予专利权", "技术方案", "科学发现", "智力活动规则"]
    methodology_steps:
      - "判断是否属于 A25 列举的不授予专利权的情形"
      - "判断是否构成技术方案（技术手段+技术问题+技术效果三要素）"
      - "判断是否违反法律、社会公德或妨害公共利益"
      - "结论：属于保护客体 / 不属于保护客体"
    primary_tools: ["read", "grep", "knowledge_search", "search_knowledge"]

  # P-A05 — 充分公开（专利法第 26 条第 3 款）
  - id: "P-A05"
    worker: "provision-disclosure"
    name: "充分公开条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第26条第3款"
    concept_ids: ["充分公开", "能够实现", "清楚完整", "所属领域技术人员"]
    methodology_steps:
      - "完整性检查：说明书五部分是否完整"
      - "清楚性检查：技术方案描述是否清楚明确"
      - "能够实现性检查：所属领域技术人员能否根据说明书实现发明"
      - "结合技术领域判断：机械/电学/化学/软件各有特别要求"
      - "结论：充分公开 / 未充分公开，附缺陷清单"
    primary_tools: ["read", "grep", "knowledge_search", "search_knowledge", "knowledge_rules"]
    existing_subgraph: "domains/enablement"  # Mady 已有 Pregel 子图
    tool_hints: "使用 evaluate_enablement 工具进行充分公开三步法判断（参数：technical_features/pfe_chain）"

  # P-A06 — 权利要求清楚支持（专利法第 26 条第 4 款）
  - id: "P-A06"
    worker: "provision-claims-clarity"
    name: "权利要求清楚支持条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第26条第4款"
      - "专利法实施细则第20条至第22条"
    concept_ids: ["权利要求", "清楚", "支持", "必要技术特征", "功能性特征"]
    methodology_steps:
      - "清楚性审查：术语是否明确、边界是否清晰"
      - "简要性审查：是否有不必要的重复限定"
      - "支持性审查：上位概念是否有下位实施例支撑"
      - "功能性限定审查：是否覆盖了所有实现方式"
      - "引用基础检查：从属权利要求引用号是否正确"
      - "结论：清楚支持 / 存在缺陷，附具体问题清单"
    primary_tools: ["read", "grep", "knowledge_search", "search_knowledge", "knowledge_rules"]

  # P-A07 — 修改超范围（专利法第 33 条）
  - id: "P-A07"
    worker: "provision-amendment"
    name: "修改超范围条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第33条"
    concept_ids: ["修改超范围", "原申请文件记载范围"]
    methodology_steps:
      - "确定原申请文件（说明书+权利要求书+附图）的记载范围"
      - "逐项对比修改内容与原申请文件"
      - "判断修改内容是否可从原申请文件直接且毫无疑义地确定"
      - "结论：未超范围 / 修改超范围，附超范围内容清单"
    primary_tools: ["read", "grep", "knowledge_search", "search_knowledge", "knowledge_rules"]

  # P-C04 — 现有技术认定（专利法第 22 条第 5 款）
  - id: "P-C04"
    worker: "provision-prior-art"
    name: "现有技术认定条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第22条第5款（现有技术定义）"
    concept_ids: ["现有技术", "出版物公开", "使用公开", "以其他方式公开"]
    methodology_steps:
      - "认定对比文件的公开日"
      - "判断公开内容是否充分（使所属领域技术人员能够实现）"
      - "判断是否属于为公众所知的技术"
      - "区分现有技术与抵触申请"
      - "结论：构成现有技术 / 不构成现有技术"
    primary_tools: ["read", "grep", "knowledge_search", "search_knowledge", "knowledge_rules"]

  # P-D01 — 权利要求书撰写（专利法第 26 条第 4 款 + 细则第 20-23 条）
  - id: "P-D01"
    worker: "provision-drafting-claims"
    name: "权利要求书撰写智能体"
    pre_register: true
    legal_basis:
      - "专利法第26条第4款"
      - "专利法实施细则第20条至第23条"
    concept_ids: ["权利要求", "必要技术特征", "独立权利要求", "从属权利要求"]
    methodology_steps:
      - "从技术方案中提取发明点和全部必要技术特征"
      - "独立权利要求撰写：前序部分+特征部分"
      - "多层级从属权利要求构建"
      - "权利要求书逻辑与一致性检查"
      - "结论：输出完整权利要求书草稿"
    primary_tools: ["read", "grep", "write", "knowledge_search", "search_knowledge", "knowledge_rules"]
    existing_subgraph: "domains/claimdrafting"  # Mady 已有 builder + rules
    tool_hints: "使用 draft_claims 工具进行权利要求书撰写（参数：invention_name/technical_features/tech_domain）"

  # P-A08 — 单一性（专利法第 31 条）
  - id: "P-A08"
    worker: "provision-unity"
    name: "单一性条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第31条"
    concept_ids: ["单一性", "特定技术特征", "总的发明构思"]
    methodology_steps:
      - "识别所有权利要求之间的相同或相应的特定技术特征"
      - "将权利要求分组，判断是否存在技术关联"
      - "分析是否属于一个总的发明构思"
      - "结论：具有单一性 / 不具备单一性"
    primary_tools: ["read", "knowledge_search"]

  # P-A09 — 外观设计（专利法第 23 条）
  - id: "P-A09"
    worker: "provision-design-auth"
    name: "外观设计授权条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第23条"
    concept_ids: ["外观设计", "现有设计", "明显区别"]
    methodology_steps:
      - "确定外观设计产品的用途和保护范围"
      - "从一般消费者角度进行整体观察、综合判断"
      - "分析设计空间，判断设计自由度"
      - "与现有设计对比，判断是否具有明显区别"
    primary_tools: ["read", "knowledge_search"]

  # P-B01 — 权利要求解释（专利法第 64 条）
  - id: "P-B01"
    worker: "provision-claim-construction"
    name: "权利要求解释条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第64条"
      - "最高人民法院关于审理侵犯专利权纠纷案件的司法解释"
    concept_ids: ["权利要求解释", "保护范围", "功能性特征"]
    methodology_steps:
      - "确定权利要求中用语的技术含义"
      - "结合说明书及附图进行解释"
      - "对功能性限定特征确定具体内容"
      - "确定权利要求的保护范围边界"
    primary_tools: ["read", "grep", "knowledge_search"]

  # P-B02 — 全面覆盖侵权（专利法第 11 条）
  - id: "P-B02"
    worker: "provision-infringement-literal"
    name: "全面覆盖侵权条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第11条"
      - "最高院侵犯专利权纠纷司法解释第7条"
    concept_ids: ["全面覆盖", "字面侵权", "技术特征对比"]
    methodology_steps:
      - "确定权利要求保护范围"
      - "提取被控方案全部技术特征"
      - "逐项对比是否全面覆盖"
      - "得出相同侵权结论"
    primary_tools: ["read", "grep", "knowledge_search", "knowledge_rules"]

  # P-B03 — 等同侵权（专利法第 39 条/司法解释）
  - id: "P-B03"
    worker: "provision-infringement-equivalent"
    name: "等同侵权条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第39条"
      - "最高院侵犯专利权纠纷司法解释第7条"
    concept_ids: ["等同侵权", "手段-功能-效果", "禁止反悔"]
    methodology_steps:
      - "识别未全面覆盖的区别特征"
      - "手段-功能-效果三要素对比"
      - "判断是否为显而易见替换"
      - "得出等同侵权结论"
    primary_tools: ["read", "grep", "knowledge_search", "knowledge_rules"]

  # P-B04 — 间接侵权（司法解释二第 21 条）
  - id: "P-B04"
    worker: "provision-indirect-infringement"
    name: "间接侵权条款智能体"
    pre_register: true
    legal_basis:
      - "最高院关于审理侵犯专利权纠纷案件应用法律若干问题的解释（二）第21条"
    concept_ids: ["间接侵权", "帮助侵权", "教唆侵权"]
    methodology_steps:
      - "确认是否存在直接侵权行为或可能性"
      - "分析是否构成帮助侵权"
      - "分析是否构成教唆侵权"
      - "判断因果关系"
    primary_tools: ["read", "grep", "knowledge_search"]

  # P-B05 — 侵权抗辩
  - id: "P-B05"
    worker: "provision-defenses"
    name: "侵权抗辩条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第62条（现有技术抗辩）"
      - "专利法第75条（不视为侵权的情形）"
    concept_ids: ["现有技术抗辩", "先用权", "合法来源", "Bolar例外"]
    methodology_steps:
      - "识别被控侵权人提出的抗辩事由"
      - "分析现有技术抗辩是否成立"
      - "分析先用权抗辩是否成立"
      - "分析合法来源等其他抗辩事由"
    primary_tools: ["read", "grep", "knowledge_search"]

  # P-B06 — 损害赔偿（专利法第 71 条）
  - id: "P-B06"
    worker: "provision-damages"
    name: "损害赔偿条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第71条"
      - "最高院惩罚性赔偿解释"
    concept_ids: ["损害赔偿", "惩罚性赔偿", "合理开支"]
    methodology_steps:
      - "确定适用赔偿计算方式"
      - "收集分析实际损失/侵权获利证据"
      - "计算赔偿基数，确定赔偿倍数"
      - "评估合理开支"
    primary_tools: ["read", "grep", "knowledge_search"]

  # P-C01 — 权属（专利法第 6-8 条）
  - id: "P-C01"
    worker: "provision-ownership"
    name: "权属条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第6条（职务发明）"
      - "专利法第7条"
      - "专利法第8条（合作/委托发明）"
    concept_ids: ["职务发明", "合作发明", "委托发明", "权属纠纷"]
    methodology_steps:
      - "确认专利申请的发明人和申请人信息"
      - "分析是否属于职务发明"
      - "分析是否存在合作或委托发明情形"
      - "给出权属认定结论"
    primary_tools: ["read", "grep", "knowledge_search"]

  # P-C02 — 无效宣告程序（专利法第 45-47 条）
  - id: "P-C02"
    worker: "provision-invalidity-procedure"
    name: "无效宣告程序条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第45条"
      - "专利法第46条"
      - "专利法第47条"
    concept_ids: ["无效宣告", "请求人资格", "证据规则", "口审"]
    methodology_steps:
      - "确认请求人资格和法定期限"
      - "梳理无效宣告的理由和证据组合"
      - "预判专利权人可能的抗辩理由"
      - "给出无效宣告程序策略建议"
    primary_tools: ["read", "grep", "knowledge_search"]

  # P-C03 — 复审程序（专利法第 41-42 条）
  - id: "P-C03"
    worker: "provision-reexamination"
    name: "复审程序条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第41条"
      - "专利法第42条"
    concept_ids: ["复审", "驳回决定", "复审请求"]
    methodology_steps:
      - "确认提出复审请求的期限和形式要件"
      - "分析驳回决定中引用的对比文件和理由"
      - "评估修改申请文件的可能性和策略"
      - "给出复审成功概率评估和建议"
    primary_tools: ["read", "grep", "knowledge_search"]

  # P-C05 — 优先权（专利法第 29-30 条）
  - id: "P-C05"
    worker: "provision-priority"
    name: "优先权条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第29条"
      - "专利法第30条"
    concept_ids: ["优先权", "相同主题", "首次申请"]
    methodology_steps:
      - "确认优先权基础申请的申请日/申请号/受理国"
      - "判断在后申请与基础申请是否涉及相同主题"
      - "核实优先权期限是否满足"
      - "给出优先权成立与否的结论"
    primary_tools: ["read", "grep", "knowledge_search"]

  # P-D02 — 说明书撰写（专利法第 26 条第 3 款）
  - id: "P-D02"
    worker: "provision-drafting-spec"
    name: "说明书撰写智能体"
    pre_register: true
    legal_basis:
      - "专利法第26条第3款"
    concept_ids: ["说明书", "实施例", "充分公开", "五部分"]
    methodology_steps:
      - "分析发明点与技术问题，确定说明书整体框架"
      - "说明书五部分结构撰写（名称/领域/背景/内容/实施方式）"
      - "撰写具体实施方式，提供足够数量的实施例"
      - "检查说明书与权利要求的对应关系"
      - "检查充分公开性"
    primary_tools: ["read", "grep", "write", "knowledge_search"]

  # P-D03 — 审查意见答复（专利法第 26 条/审查指南）
  - id: "P-D03"
    worker: "patent-oa-response-drafter"
    name: "审查意见答复条款智能体"
    pre_register: true
    legal_basis:
      - "专利法第26条"
      - "专利审查指南"
    concept_ids: ["审查意见答复", "意见陈述书", "修改"]
    methodology_steps:
      - "读取审查意见全文，逐条分析驳回理由"
      - "针对每条理由制定答复策略"
      - "撰写意见陈述书"
      - "检查答复书的格式规范性和逻辑完整性"
    primary_tools: ["read", "grep", "write", "knowledge_search"]

# =============================================================================
# Tier B — 推理模式（跨条款的认定步骤封装，供 Tier A 调用）
# =============================================================================
reasoning:

  # R-01 — 现有技术认定推理
  - id: "R-01"
    worker: "reasoning-prior-art-identification"
    name: "现有技术认定推理"
    pre_register: true
    serves: ["P-A01", "P-C04"]
    methodology_steps:
      - "确定文献公开日与申请日/优先权日的时间关系"
      - "判断公开内容是否充分"
      - "判断是否属于公众可得知的状态"
      - "输出认定结论与依据"
