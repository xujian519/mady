      check:
        keywords:
            - CNXXXXXX
            - CNxxxxxx
            - CNXXXXXXX
            - CNxxxxxxx
            - CN20XX
            - CN20xx
            - (20XX)
            - (20xx)
            - （20XX）
            - （20xx）
            - USXXXXXXX
            - USXXXXXXXX
