# 批 A-1：block 级确定性门禁规则
#
# 由 scripts/rulescan 从 deepseek-harness 规则资产机械转换生成，请勿手改；
# 重新生成：go run ./scripts/rulescan --src <dsh 规则目录> --emit domains/rules/data/rules/gate
#
# 转换口径：保留 id/name/description/legalBasis/domain/severity/action 与 check 全字段；
# 仅收录可确定性判定的规则，log 级规则不纳入。

rules:
    - action: block
      check:
        requiresAll:
            - element: technical_means
              patterns:
                - 装置
                - 设备
                - 机构
                - 系统
                - 单元
                - 模块
                - 组件
                - 步骤
                - 方法
            - element: technical_problem
              patterns:
                - 技术问题
                - 解决
                - 克服
                - 改善
            - element: technical_effect
              patterns:
                - 技术效果
                - 有益效果
                - 优点
                - 提高
                - 降低
                - 增强
        type: structural_analysis
      domain: patent_general
      legalBasis: 专利法第二条第二款
      name: 发明定义-技术方案三要素
      ruleId: CON-101
      severity: critical
    - action: block
      check:
        keywords:
            - 编造
            - 虚构
            - 杜撰
            - 捏造
        negationContext: true
        quoteImmune: true
        type: keyword_blocklist
      name: 禁止编造对比文件
      ruleId: CON-102
      severity: critical
    - action: block
      check:
        requiresAll:
            - element: clear_description
              patterns:
                - 技术方案
                - 具体实施方式
                - 实施例
            - element: reproducible
              patterns:
                - 本领域技术人员
                - 能够实现
                - 按照
        type: structural_analysis
      domain: patent_disclosure
      legalBasis: 专利法第二十六条第三款
      name: 充分公开-能够实现
      ruleId: CON-201
      severity: critical
    - action: block
      check:
        minConfidence: 1
        requiresAll:
            - description: 权利要求清楚
              element: 期望模式
              patterns:
                - 清楚
                - 简要
                - 限定
                - 必要技术特征
        type: structural_analysis
      domain: patent_claims
      legalBasis: 专利法第二十六条第四款
      name: 权利要求清楚
      ruleId: CON-301
      severity: critical
    - action: block
      check:
        requiresAll:
            - element: spec_support
              patterns:
                - 说明书
                - 实施例
                - 具体实施方式
            - element: claim_scope
              patterns:
                - 保护范围
                - 限定
                - 技术特征
        type: structural_analysis
      domain: patent_claims
      legalBasis: 专利法第二十六条第四款
      name: 权利要求以说明书为依据
      ruleId: CON-302
      severity: critical
    - action: block
      check:
        minConfidence: 1
        requiresAll:
            - description: 创造性非显而易见性判断
              element: 期望模式
              patterns:
                - 显而易见
                - 容易想到
                - 常规技术手段
                - 惯用技术手段
                - 具备创造性
                - 非显而易见
        type: structural_analysis
      domain: patent_inventiveness
      legalBasis: 专利法第二十二条第三款
      name: 创造性非显而易见性判断
      ruleId: CON-401
      severity: critical
    - action: block
      check:
        minConfidence: 1
        requiresAll:
            - description: 修改不超范围
              element: 期望模式
              patterns:
                - 原说明书
                - 原权利要求书
                - 原申请
                - 原始公开
        type: structural_analysis
      domain: patent_procedure
      legalBasis: 专利法第三十三条
      name: 修改不超范围
      ruleId: CON-501
      severity: critical
    - action: block
      check:
        minConfidence: 1
        requiresAll:
            - description: 权利要求修改不得扩大保护范围
              element: 期望模式
              patterns:
                - 扩大
                - 保护范围
                - 修改
        type: structural_analysis
      description: 与授权的权利要求相比，不得扩大原专利的保护范围
      domain: patent_procedure
      legalBasis: 专利法第三十三条；审查指南第四部分第三章4.6.1
      name: 权利要求修改不得扩大保护范围
