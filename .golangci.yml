# Mady Project - golangci-lint Configuration (v2 format)
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: false

linters:
  default: none
  enable:
    # 标准必启
    - errcheck        # 检查未处理的错误
    - govet           # go vet
    - ineffassign     # 无效赋值检测
    - staticcheck     # 静态分析（SA 级）
    - unused          # 未使用变量/类型/常量
    - misspell        # 拼写检查
    - unconvert       # 不必要的类型转换

    # 代码质量
    - goconst         # 可提取为常量的重复字符串
    - revive          # golint 替代（增强版）
    - gocognit        # 认知复杂度（阈值 30，防止过度复杂函数）
    - dupl            # 重复代码检测（阈值 100 token）
    - unparam         # 未使用参数检测

    # 正确性
    - bodyclose       # HTTP 响应体是否关闭
    - noctx           # HTTP 请求是否携带 context
    - copyloopvar     # 循环变量引用副本（替代 exportloopref）

    # 性能与安全性
    - durationcheck   # 时间乘时间错误
    - errchkjson      # JSON 编码类型检查
    - gosec           # 安全审查

  settings:
    goconst:
      min-len: 15
      min-occurrences: 15
      ignore-calls: true
    gocognit:
      min-complexity: 30
    dupl:
      threshold: 100
    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - cancelling
        - capitalise
        - centre
        - colour
        - defence
        - licence
        - optimise
        - organise
        - programme
    revive:
      severity: warning
      rules:
        - name: blank-imports
          severity: warning
        - name: context-keys-type
          severity: warning
        - name: error-return
          severity: warning
        - name: dot-imports
          severity: warning
        - name: error-naming
          severity: warning
        - name: indent-error-flow
          disabled: true
        - name: increment-decrement
          severity: warning
        - name: package-comments
          disabled: true
        - name: range
          severity: warning
        - name: receiver-naming
          severity: warning
        - name: time-naming
          severity: warning
        - name: unexported-return
          severity: warning
        - name: errorf
          severity: warning
        - name: empty-block
          severity: warning
        - name: superfluous-else
          severity: warning
        - name: unreachable-code
          severity: warning
        - name: redefines-builtin-id
          severity: warning
    gosec:
      excludes:
        - G404   # 弱随机数生成器（项目已知设计选择）
        - G115   # 整数溢出（项目已知设计选择）
        - G402   # TLS 配置（非 TLS 服务）
    staticcheck:
      checks:
        - all
        - "-SA1019"  # 已弃用 API 的使用（已知技术债务）

  exclusions:
    paths:
      - graphify-out
      - build
      - .grok
      - .git
    rules:
      - path: "_test\\.go"
        linters:
          - goconst
          - errcheck
          - gosec
      - path: "doc\\.go"
        linters:
          - unused
      - path: ".*_gen\\.go"
        linters:
          - all
      - path: ".*\\.pb\\.go"
        linters:
          - all
    # 清理/交互类错误忽略（历史 tools 模块 errcheck 豁免，tools 已并入根模块，
    # 2026-08-22 后豁免随根配置保留）：
    # defer Close/Remove/Kill/Wait、fire-and-forget 桌面按键、交互式读取等
    # 在清理路径中忽略返回值是安全惯例。
      - linters:
          - errcheck
        source: "defer .*\\.(Close|Remove|RemoveAll|Kill|Wait)\\("
      - linters:
          - errcheck
        source: "\\.(Kill|Wait|CloseSession|CloseTab|Close)\\("
      - linters:
          - errcheck
        source: "fmt\\.(Sscanf|Scanln)\\("
      - linters:
          - errcheck
        source: "os\\.(Remove|MkdirAll)\\("
      - linters:
          - errcheck
        source: "(syscall\\.Kill|filepath\\.WalkDir)\\("
      - linters:
          - errcheck
        source: "(ReapOrphans|StopScreencast|StopRecording|HandleDialog|StartRecording|egoLiteMgr\\.Close)\\("
      - linters:
          - errcheck
        source: "(xdoKey|osaKeyImpl|winKey)\\("
      - linters:
          - errcheck
        source: "exec\\.Command.*\\.Run\\(\\)"
      - linters:
          - errcheck
        source: "io\\.Copy\\(io\\.Discard"
      - linters:
          - errcheck
        source: "conn\\.SetDeadline\\("
      - linters:
          - errcheck
        source: "cmd\\.Process\\.Kill\\(\\)"
      - linters:
          - errcheck
        source: "cmd\\.Wait\\(\\)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
