name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  commitlint:
    # 仅在 PR 上运行：对 PR 内每个 commit 单独校验 Conventional Commits。
    # 直接 push 到 main 的提交通常是 squash-merge 的产物，不再逐条校验。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: commitlint
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: .

      - name: golangci-lint (tools)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: tools

      - name: golangci-lint (tui)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: tui

      - name: golangci-lint (desktop)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: desktop

  check-arch:
    runs-on: ubuntu-latest
    name: check-arch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@latest

      - name: Run architecture boundary checks
        run: go-arch-lint check

  verify-tui-layers:
    runs-on: ubuntu-latest
    name: verify-tui-layers
    steps:
      - uses: actions/checkout@v7

      - name: Verify TUI LAYERS.md is in sync
        working-directory: tui
        run: bash scripts/verify_layers.sh

  eval:
    runs-on: ubuntu-latest
    name: eval-benchmark
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Golden Benchmark
        run: go test -count=1 -v ./evaluate/benchmark/ -run 'TestEvalSuite_'
        env:
          MADY_LIVE_EVAL: ""

      - name: Verify baseline report exists
        run: test -f docs/evaluation-baseline-v0.3.md && echo "Baseline OK"

  mod-tidy:
    runs-on: ubuntu-latest
    name: mod-tidy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go mod tidy (root)
        run: |
          go mod tidy -diff
          if [ $? -ne 0 ]; then
            echo "::error::go.mod is not tidy. Run 'go mod tidy' locally."
            exit 1
          fi

      - name: go mod tidy (tools)
        working-directory: tools
        run: |
          go mod tidy -diff
          if [ $? -ne 0 ]; then
            echo "::error::tools/go.mod is not tidy. Run 'go mod tidy' in tools/ locally."
            exit 1
          fi

      - name: go mod tidy (tui)
        working-directory: tui
        run: |
          go mod tidy -diff
          if [ $? -ne 0 ]; then
            echo "::error::tui/go.mod is not tidy. Run 'go mod tidy' in tui/ locally."
            exit 1
          fi

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        module:
          - path: "."
            name: root
          - path: "tools"
            name: tools
          - path: "tui"
            name: tui
    name: test (${{ matrix.module.name }}, ${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: go vet
        working-directory: ${{ matrix.module.path }}
        run: go vet ./...

      - name: go build
        working-directory: ${{ matrix.module.path }}
        run: go build ./...

      - name: go test
        working-directory: ${{ matrix.module.path }}
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: go test (race)
        working-directory: ${{ matrix.module.path }}
        run: go test -race -count=1 ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.module.name == 'root'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  desktop:
    runs-on: macos-latest
    name: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Ensure frontend/dist exists (go:embed prerequisite)
        working-directory: desktop
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: go vet
        working-directory: desktop
        run: go vet ./...

      - name: go build
        working-directory: desktop
        run: go build ./...

      - name: go test
        working-directory: desktop
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: go test (race)
        working-directory: desktop
        run: go test -race -count=1 ./...

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('desktop/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium (webkit not installed on CI)
        working-directory: desktop/frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend unit tests (vitest)
        working-directory: desktop/frontend
        run: pnpm test

      - name: Playwright E2E tests (chromium only)
        working-directory: desktop/frontend
        run: npx playwright test --config=playwright.config.ts --project=chromium

  example-build:
    runs-on: ubuntu-latest
    name: example-build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go build (all examples)
        run: go build ./example/...

  integration:
    runs-on: ubuntu-latest
    name: integration
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration e2e tests
        run: go test -tags integration -count=1 -timeout 10m ./integration/...
