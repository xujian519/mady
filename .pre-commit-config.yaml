repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # golden 基线含 PadToWidth 的行尾空格（像素级渲染快照），必须保留。
        exclude: '\.golden$'
      - id: end-of-file-fixer
        exclude: '\.golden$'
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: 'docs/decisions/ai-changelog/archive-'
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt -l -w
        language: system
        files: \.go$
      - id: go-imports
        name: go imports
        # 跨机器兼容：优先 $(go env GOPATH)/bin/goimports，缺失则回退 PATH 中的 goimports。
        entry: bash -ec 'G="$(go env GOPATH)/bin/goimports"; [ -x "$G" ] || G=goimports; "$G" -l -w -local github.com/xujian519/mady "$@"' --
        language: system
        files: \.go$
      - id: check-arch-boundaries
        name: architecture boundaries
        entry: bash scripts/check-arch-boundaries.sh
        language: system
        files: '\.go$'
        pass_filenames: false
      - id: go-vet
        name: go vet
        # go.work 多模块结构：必须分别 vet 根模块（含 tools/ 目录包）与
        # tui/desktop 子模块，否则根目录 `go vet ./...` 不会覆盖子模块。
        entry: bash -ec 'go vet ./... && (cd tui && go vet ./...) && (cd desktop && go vet ./...)' --
        language: system
        files: \.go$
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        # go.work 多模块结构：根模块（含 tools/ 目录包）与 tui/desktop 子模块。
        # 脚本处理跨机器兼容（GOPATH/bin 优先，PATH 回退）与未安装时的 fail-closed。
        # 与 Makefile lint target 行为对齐。
        entry: bash scripts/precommit-golangci-lint.sh
        language: system
        files: \.go$
        pass_filenames: false
      - id: golangci-lint-newcode
        name: golangci-lint (new code, exported gate)
        # 只检查相对 HEAD 的新增/修改代码：新导出符号必须带注释（revive exported，
        # 配置 .golangci-newcode.yml）。存量缺口不阻塞。首次提交（无 HEAD）时跳过。
        entry: bash -ec 'git rev-parse HEAD >/dev/null 2>&1 || exit 0; golangci-lint run --config .golangci-newcode.yml --new-from-rev=HEAD ./...' --
        language: system
        files: \.go$
        pass_filenames: false
      - id: check-comment-seams
        name: check comment seams
        # 纯搬移重构的注释拼接残留防护：重复注释行 / 英文断片（"that the" 结尾等）。
        # python3 实现（macOS BSD awk 的多字节字符串比较不可靠），直接执行靠 shebang。
        entry: scripts/check-comment-seams.sh
        language: system
        files: \.go$
      - id: check-tone-words
        name: tone-style word gate
        # 面向用户文案的禁用词门禁：词表单源解析 docs/tone-style-guide.md §4，
        # 命中即拦（--fail）。只扫 .go 变更触发；脚本内部限定面向用户文案目录
        # （guardrails/server/agui/a2ui/pkg/i18n），跳过注释、测试数据与显式豁免文件。
        entry: python3 scripts/check-tone-words.py --fail
        language: system
        files: \.go$
        pass_filenames: false
      - id: check-aichangelog-format
        name: AI_CHANGELOG format gate
        entry: bash scripts/check-aichangelog-format.sh
        language: system
        files: ^docs/decisions/ai-changelog/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$
        pass_filenames: false
      - id: check-sensitive-paths
        name: sensitive paths gate
        entry: bash scripts/check-sensitive-paths.sh --msg-file
        language: system
        stages: [commit-msg]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
