# Mady Tools - golangci-lint Configuration (v2 format)
# 与根模块 .golangci.yml 对标，逐步收紧。已修复项启用，待修复项标记。
version: "2"

run:
  timeout: 3m
  tests: false

linters:
  default: none
  enable:
    # 基础正确性（对标根模块）
    - govet           # go vet
    - ineffassign     # 无效赋值
    - errcheck        # 未处理错误
    - staticcheck     # 静态分析
    - unused          # 未使用代码

    # 代码质量（对标根模块）
    - revive          # golint 替代
    - misspell        # 拼写检查
    - unconvert       # 不必要类型转换

    # 正确性
    - copyloopvar     # 循环变量复制
    - durationcheck   # 时间运算检查

  settings:
    revive:
      severity: warning
      rules:
        - name: blank-imports
          severity: warning
        - name: context-keys-type
          severity: warning
        - name: error-return
          severity: warning
        - name: error-naming
          severity: warning
        - name: range
          severity: warning
        - name: receiver-naming
          severity: warning
        - name: time-naming
          severity: warning
        - name: unexported-return
          severity: warning
        - name: errorf
          severity: warning
        - name: empty-block
          severity: warning
        - name: superfluous-else
          severity: warning
        - name: unreachable-code
          severity: warning
        - name: redefines-builtin-id
          severity: warning
    misspell:
      locale: US

  exclusions:
    paths:
      - graphify-out
      - build
      - .grok
      - .git
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
          - revive
      # defer Close / Remove / Kill / Wait 在清理路径中是安全的
      - linters:
          - errcheck
        source: "defer .*\\.(Close|Remove|RemoveAll|Kill|Wait)\\("
      # 非 defer 的 Close / Kill / Wait 清理操作
      - linters:
          - errcheck
        source: "\\.(Kill|Wait|CloseSession|CloseTab|Close)\\("
        path: "(browser_|desktop/|ego_lite_|mcp_client|execute_code|move\\.go|write_file\\.go|web_fetch\\.go)"
      # fmt.Sscanf / fmt.Scanln 交互式读取错误表示用户取消
      - linters:
          - errcheck
        source: "fmt\\.(Sscanf|Scanln)\\("
      # os.Remove / os.MkdirAll 清理/缓存路径
      - linters:
          - errcheck
        source: "os\\.(Remove|MkdirAll)\\("
      # syscall.Kill / filepath.WalkDir
      - linters:
          - errcheck
        source: "(syscall\\.Kill|filepath\\.WalkDir)\\("
      # browser/desktop 特定安全操作
      - linters:
          - errcheck
        source: "(ReapOrphans|StopScreencast|StopRecording|HandleDialog|StartRecording|egoLiteMgr\\.Close)\\("
      # 键盘模拟函数（desktop 平台特有）
      - linters:
          - errcheck
        source: "(xdoKey|osaKeyImpl|winKey)\\("
      # exec.Command().Run 在 desktop 操作中
      - linters:
          - errcheck
        source: "exec\\.Command.*\\.Run\\(\\)"
      # io.Copy 到 io.Discard 故意丢弃
      - linters:
          - errcheck
        source: "io\\.Copy\\(io\\.Discard"
      # conn.SetDeadline 超时设置
      - linters:
          - errcheck
        source: "conn\\.SetDeadline\\("
      # grep.go 中的 Kill/Wait 清理操作
      - linters:
          - errcheck
        source: "cmd\\.Process\\.Kill\\(\\)"
        path: "grep\\.go"
      - linters:
          - errcheck
        source: "cmd\\.Wait\\(\\)"
        path: "grep\\.go"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
