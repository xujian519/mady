# Mady Tools - golangci-lint Configuration (v2 format)
# 与根模块 .golangci.yml 对标（2026-08-19 门禁统一）：
# gocognit/dupl/unparam 已启用；先修后开（108 issues → 0）。
# errcheck 保留 source 规则豁免 defer 清理/交互读取（与根配置同款）。
version: "2"

run:
  timeout: 3m
  tests: false

linters:
  default: none
  enable:
    # 基础正确性（对标根模块）
    - govet           # go vet
    - ineffassign     # 无效赋值
    - errcheck        # 未处理错误
    - staticcheck     # 静态分析
    - unused          # 未使用代码

    # 代码质量（对标根模块）
    - revive          # golint 替代
    - misspell        # 拼写检查
    - unconvert       # 不必要类型转换
    - gocognit        # 认知复杂度（阈值 30，防止过度复杂函数）
    - dupl            # 重复代码检测（阈值 100 token）
    - unparam         # 未使用参数检测

    # 代码质量（补齐自根模块 2026-07-30）
    - goconst         # 可提取为常量的重复字符串

    # 正确性
    - copyloopvar     # 循环变量复制
    - durationcheck   # 时间运算检查

    # 安全与 HTTP 正确性（补齐自根模块 2026-07-30）
    - bodyclose       # HTTP 响应体是否关闭
    - noctx           # HTTP 请求是否携带 context
    - errchkjson      # JSON 编码类型检查
    - gosec           # 安全审查

  settings:
    revive:
      severity: warning
      rules:
        - name: blank-imports
          severity: warning
        - name: context-keys-type
          severity: warning
        - name: error-return
          severity: warning
        - name: error-naming
          severity: warning
        - name: range
          severity: warning
        - name: receiver-naming
          severity: warning
        - name: time-naming
          severity: warning
        - name: unexported-return
          severity: warning
        - name: errorf
          severity: warning
        - name: empty-block
          severity: warning
        - name: superfluous-else
          severity: warning
        - name: unreachable-code
          severity: warning
        - name: redefines-builtin-id
          severity: warning
    goconst:
      min-len: 15
      min-occurrences: 15
      ignore-calls: true
    gocognit:
      min-complexity: 30
    dupl:
      threshold: 100
    gosec:
      excludes:
        - G404   # 弱随机数生成器（项目已知设计选择）
        - G115   # 整数溢出（项目已知设计选择）
        - G402   # TLS 配置（非 TLS 服务）
    misspell:
      locale: US

  exclusions:
    paths:
      - graphify-out
      - build
      - .grok
      - .git
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
          - revive
      # defer Close / Remove / Kill / Wait 在清理路径中是安全的
      - linters:
          - errcheck
        source: "defer .*\\.(Close|Remove|RemoveAll|Kill|Wait)\\("
      # 非 defer 的 Close / Kill / Wait 清理操作
      - linters:
          - errcheck
        source: "\\.(Kill|Wait|CloseSession|CloseTab|Close)\\("
        path: "(browser_|desktop/|ego_lite_|mcp_client|execute_code|move\\.go|write_file\\.go|web_fetch\\.go)"
      # fmt.Sscanf / fmt.Scanln 交互式读取错误表示用户取消
      - linters:
          - errcheck
        source: "fmt\\.(Sscanf|Scanln)\\("
      # os.Remove / os.MkdirAll 清理/缓存路径
      - linters:
          - errcheck
        source: "os\\.(Remove|MkdirAll)\\("
      # syscall.Kill / filepath.WalkDir
      - linters:
          - errcheck
        source: "(syscall\\.Kill|filepath\\.WalkDir)\\("
      # browser/desktop 特定安全操作
      - linters:
          - errcheck
        source: "(ReapOrphans|StopScreencast|StopRecording|HandleDialog|StartRecording|egoLiteMgr\\.Close)\\("
      # 键盘模拟函数（desktop 平台特有）
      - linters:
          - errcheck
        source: "(xdoKey|osaKeyImpl|winKey)\\("
      # exec.Command().Run 在 desktop 操作中
      - linters:
          - errcheck
        source: "exec\\.Command.*\\.Run\\(\\)"
      # io.Copy 到 io.Discard 故意丢弃
      - linters:
          - errcheck
        source: "io\\.Copy\\(io\\.Discard"
      # conn.SetDeadline 超时设置
      - linters:
          - errcheck
        source: "conn\\.SetDeadline\\("
      # grep.go 中的 Kill/Wait 清理操作
      - linters:
          - errcheck
        source: "cmd\\.Process\\.Kill\\(\\)"
        path: "grep\\.go"
      - linters:
          - errcheck
        source: "cmd\\.Wait\\(\\)"
        path: "grep\\.go"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
