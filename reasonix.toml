# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/.reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 3   # schema marker for diagnostics; old versions may ignore it
default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[agent]
# system_prompt = """..."""   # omit to use the built-in prompt for this version
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
# max_steps         = 0   # executor tool-call rounds; 0 = no limit
# planner_max_steps = 12   # planner read-only tool-call rounds; 0 = no limit
temperature       = 0.0
auto_plan   = "off"   # off|on; off keeps plan mode manual
# reasoning_language = "zh"   # visible reasoning language: auto|zh|en
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.5   # notice only; keeps cache-first prefix intact
compact_ratio       = 0.8   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9   # force compacting at this high-water mark
# keep                = ["errors"]   # compaction keep policy: errors, user_marked
# recent_keep         = 2   # minimum recent messages kept verbatim
cold_resume_prune   = true   # elide stale tool results when reopening a session past the provider cache window
# planner_model = "mimo"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap

[tools.background_jobs]
stalled_warning_seconds = 900   # warn once per background job after this many quiet seconds; 0 disables

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
# Per-call gating. mode = writer fallback when no rule matches: ask|allow|deny.
# Readers always default to allow. Precedence: deny > ask > allow > fallback.
# Rules are "Tool" or "Tool(specifier)"; e.g. Bash(go test:*), Edit(src/**).
mode  = "ask"
# deny = ["Bash(rm -rf*)", "Bash(git push*)"]   # hard-blocked in every mode
allow = ["task", "Edit(src/**)",
  # Git read-only
  "Bash(cd /Users/xujian/projects/Mady && git status)",
  "Bash(cd /Users/xujian/projects/Mady && git log --oneline -10)",
  "Bash(cd /Users/xujian/projects/Mady && git remote -v)",
  "Bash(cd /Users/xujian/projects/Mady && git diff --stat)",
  "Bash(cd /Users/xujian/projects/Mady && git ls-remote origin HEAD 2>/dev/null && echo \"---\" && git rev-parse HEAD)",
  "Bash(cd /Users/xujian/projects/Mady && git stash && go test -tags integration -count=1 -run TestDrafting_WorkflowTool ./integration/... 2>&1 | tail -5)",
  # Build & test
  "Bash(cd /Users/xujian/projects/Mady && go build ./... 2>&1 | tail -5)",
  "Bash(cd /Users/xujian/projects/Mady && go build ./... && go build ./example/... && echo \"build OK\")",
  "Bash(cd /Users/xujian/projects/Mady && go vet ./... 2>&1 | head -30)",
  "Bash(cd /Users/xujian/projects/Mady && go test -count=1 -v ./evaluate/benchmark/ -run 'TestEvalSuite_' 2>&1 | head -40)",
  "Bash(cd /Users/xujian/projects/Mady && go test -tags integration -count=1 ./integration/... 2>&1 | tail -20)",
  "Bash(cd /Users/xujian/projects/Mady && go test -tags integration -count=1 -v ./integration/... 2>&1 | head -80)",
  "Bash(cd /Users/xujian/projects/Mady && make verify 2>&1 | tail -80)",
  "Bash(cd /Users/xujian/projects/Mady && make verify 2>&1)",
  "Bash(cd /Users/xujian/projects/Mady && go mod tidy -diff 2>&1)",
  "Bash(cd /Users/xujian/projects/Mady && go mod tidy 2>&1)",
  "Bash(cd /Users/xujian/projects/Mady/tools && go vet ./... 2>&1 | head -40)",
  "Bash(cd /Users/xujian/projects/Mady/tools && go vet ./... 2>&1)",
  "Bash(cd /Users/xujian/projects/Mady/tools && go mod tidy -diff 2>&1)",
  "Bash(cd /Users/xujian/projects/Mady/tui && go mod tidy -diff 2>&1)",
  "Bash(cd /Users/xujian/projects/Mady/tui && bash scripts/verify_layers.sh --diff 2>&1)",
  "Bash(cd /Users/xujian/projects/Mady/tui && bash scripts/verify_layers.sh 2>&1)",
  "Bash(cd /Users/xujian/projects/Mady/tui && bash scripts/verify_layers.sh)",
  # Lint & CI
  "Bash(cd /Users/xujian/projects/Mady && golangci-lint run --timeout=5m . 2>&1 | head -20)",
  "Bash(cd /Users/xujian/projects/Mady && golangci-lint run --timeout=5m ./... 2>&1 | head -20)",
  "Bash(cd /Users/xujian/projects/Mady && ls .golangci* 2>/dev/null; ls tui/.golangci* 2>/dev/null; ls tools/.golangci* 2>/dev/null)",
  "Bash(cd /Users/xujian/projects/Mady && gh pr list --state open 2>/dev/null || echo \"gh not available or no PRs\")",
  "Bash(cd /Users/xujian/projects/Mady && gh run list --limit 10 --json conclusion,headBranch,name,status,createdAt 2>/dev/null || echo \"gh not available\")",
  "Bash(cd /Users/xujian/projects/Mady && gh run list --limit 1 --json databaseId,conclusion,headBranch --jq '.[0].databaseId' 2>/dev/null)",
  # Project discovery
  "Bash(cd /Users/xujian/projects/Mady && ls -la .github/ 2>/dev/null || echo \"No .github directory\")",
  "Bash(cd /Users/xujian/projects/Mady && ls -la .circleci/ 2>/dev/null; ls -la .gitlab-ci.yml 2>/dev/null; ls -la Jenkinsfile 2>/dev/null; echo \"done\")",
  "Bash(cd /Users/xujian/projects/Mady && ls .github/workflows/ 2>/dev/null || echo \"No workflows\")",
  # Branch investigation (read-only for loops)
  "Bash(cd /Users/xujian/projects/Mady && for b in origin/dependabot/go_modules/github.com/chromedp/chromedp-0.16.0 origin/dependabot/go_modules/modernc.org/sqlite-1.54.0 origin/dependabot/go_modules/tools/github.com/chromedp/chromedp-0.16.0 origin/fix/spec-system-remediation; do echo \"=== $b ===\" && git log --oneline main..$b && echo \"---\"; done)",
  "Bash(cd /Users/xujian/projects/Mady && for b in worktree-agent-a15ea9032b02b098d worktree-agent-a2d791daa112e8d1d worktree-agent-a3f43f4bda2e03ba9 worktree-agent-a577700b4fcf469db worktree-agent-a7ba077a9e31cc084 worktree-agent-a96ede87d90172e9f; do echo \"=== $b ===\" && git log --oneline main..$b && echo \"---\"; done)"]
# ask = ["Edit(src/**)"]   # force a prompt even if otherwise allowed

[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) and allow_write extras.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

