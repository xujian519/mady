version: 3
workdir: .

exclude:
  - .claude
  - .git
  - vendor
  - node_modules

allow:
  depOnAnyVendor: true
  deepScan: false       # 关闭后仅检测包级导入，不追踪方法调用链。如需完整依赖追踪设为 true。
  ignoreNotFoundComponents: true  # 组件配置中引用的目录不存在时静默忽略（支持渐进式迁移）。

# 定义项目中所有可导入的 Go 包目录
components:
  agentcore:
    in:
      - ./agentcore/**
  graph:
    in: ./graph/**
  tui_chat:
    in: ./tui/chat/**
  tui_core:
    in: ./tui/core/**
  tui_component:
    in: ./tui/component/**
  tui_terminal:
    in: ./tui/terminal/**
  tui_theme:
    in: ./tui/theme/**
  tui_layout:
    in: ./tui/layout/**
  tui_agentadapter:
    in: ./tui/agentadapter/**
  tui_root:
    in:
      - ./tui/
      - ./tui/internal/**
  knowledge:
    in: ./knowledge/**
  memory:
    in: ./memory/**
  retrieval:
    in: ./retrieval/**
  server:
    in: ./server/**
  provider:
    in: ./provider/**
  disclosure:
    in: ./disclosure/**
  tools_submodule:
    in: ./tools/**
  domains:
    in: ./domains/**
  doomloop:
    in: ./doomloop/**
  evaluate:
    in: ./evaluate/**
  tracing:
    in: ./tracing/**
  guardrails:
    in: ./guardrails/**
  psychological:
    in: ./psychological/**
  a2a:
    in: ./a2a/**
  a2ui:
    in: ./a2ui/**
  acp:
    in: ./acp/**
  agui:
    in: ./agui/**
  mcp:
    in: ./mcp/**
  workflows:
    in: ./workflows/**
  session:
    in: ./session/**
  store:
    in: ./store/**
  skill:
    in: ./skill/**
  fuzzy:
    in: ./fuzzy/**
  prompt:
    in: ./prompt/**
  integration:
    in: ./integration/**
  example:
    in: ./example/**
  cmd:
    in: ./cmd/**
  desktop:
    in: ./desktop/**
  pkg:
    in: ./pkg/**
  scripts:
    in: ./scripts/**
  intent:
    in: ./intent/**
  internal_intentrules:
    in: ./internal/intentrules/**
  bootstrap:
    in: ./bootstrap/**

# 依赖规则
# 未在此列出的组件默认可导入任何项目组件（anyProjectDeps: true）
deps:
  # intent 提供统一意图分类管线，属于基础设施扩展层
  intent:
    anyProjectDeps: true
  # internal_intentrules 提供共享关键词列表和匹配工具，无内部依赖
  internal_intentrules:
    anyProjectDeps: true
  # bootstrap 是全局装配器，需要导入所有层级的包
  bootstrap:
    anyProjectDeps: true
  # agentcore 不得导入 domains, server, tui
  agentcore:
    mayDependOn:
      - agentcore
      - graph
      - knowledge
      - memory
      - retrieval
      - provider
      - disclosure
      - tools_submodule
      - doomloop
      - evaluate
      - tracing
      - guardrails
      - psychological
      - a2a
      - a2ui
      - acp
      - agui
      - mcp
      - workflows
      - session
      - store
      - skill
      - fuzzy
      - prompt
      - integration
      - example
      - cmd
      - pkg
      - scripts

