# Mady TUI - golangci-lint Configuration (v2 format)
# 与根模块 .golangci.yml 对标（2026-08-19 门禁统一）：
# TUI 为 8 层 Elm 架构终端 UI，无 HTTP 客户端代码，故不含 bodyclose。
# gocognit/dupl/unparam/gosec/noctx 已启用；先修后开（59 issues → 0）。
version: "2"

run:
  timeout: 3m
  tests: false

linters:
  default: none
  enable:
    # 基础正确性
    - errcheck        # 检查未处理的错误
    - govet           # go vet
    - ineffassign     # 无效赋值检测
    - staticcheck     # 静态分析（SA 级）
    - unused          # 未使用变量/类型/常量
    - misspell        # 拼写检查
    - unconvert       # 不必要的类型转换

    # 代码质量（对标根模块 2026-08-19）
    - goconst         # 可提取为常量的重复字符串
    - revive          # golint 替代（增强版）
    - gocognit        # 认知复杂度（阈值 30，防止过度复杂函数）
    - dupl            # 重复代码检测（阈值 100 token）
    - unparam         # 未使用参数检测

    # 正确性
    - copyloopvar     # 循环变量引用副本
    - durationcheck   # 时间乘时间错误

    # 安全（对标根模块 2026-08-19）
    - gosec           # 安全审查
    - noctx           # HTTP 请求是否携带 context

  settings:
    goconst:
      min-len: 15
      min-occurrences: 15
      ignore-calls: true
    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - cancelling
        - colour
        - defence
        - licence
        - optimise
        - organise
    revive:
      severity: warning
      rules:
        - name: blank-imports
          severity: warning
        - name: context-keys-type
          severity: warning
        - name: error-return
          severity: warning
        - name: error-naming
          severity: warning
        - name: increment-decrement
          severity: warning
        - name: range
          severity: warning
        - name: receiver-naming
          severity: warning
        - name: time-naming
          severity: warning
        - name: unexported-return
          severity: warning
        - name: errorf
          severity: warning
        - name: empty-block
          severity: warning
        - name: superfluous-else
          severity: warning
        - name: unreachable-code
          severity: warning
        - name: redefines-builtin-id
          severity: warning
    gocognit:
      min-complexity: 30
    dupl:
      threshold: 100
    gosec:
      excludes:
        - G404   # 弱随机数生成器（项目已知设计选择）
        - G115   # 整数溢出（项目已知设计选择）
        - G402   # TLS 配置（非 TLS 服务）
    staticcheck:
      checks:
        - all
        - "-SA1019"

  exclusions:
    paths:
      - .git
    rules:
      - path: "_test\\.go"
        linters:
          - goconst
          - errcheck
      - path: "doc\\.go"
        linters:
          - unused
      - path: ".*_gen\\.go"
        linters:
          - all
      - path: ".*\\.pb\\.go"
        linters:
          - all

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
